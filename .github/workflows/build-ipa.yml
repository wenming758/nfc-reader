name: Build IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned IPA
        run: |
          chmod +x Scripts/build_ipa.sh
          ./Scripts/build_ipa.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFCReader-unsigned-ipa
          path: build/NFCReader-unsigned.ipa
          if-no-files-found: error

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/NFCReader-unsigned.ipa \
            --title "NFCReader ${GITHUB_REF_NAME}" \
            --notes "Unsigned IPA. Re-sign with your own Apple developer certificate before installing."
